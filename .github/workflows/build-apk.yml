# name: Build BlinkScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Unduh Otomatis Model MediaPipe FaceLandmarker
      run: |
        mkdir -p app/src/main/assets
        curl -L -o app/src/main/assets/face_landmarker.task https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task

    - name: Beri Izin Eksekusi Gradle Wrapper
      run: chmod +x gradlew

    - name: Kompilasi APK Debug
      run: ./gradlew assembleDebug --no-daemon

    - name: Unggah Hasil APK Siap Install
      uses: actions/upload-artifact@v4
      with:
        name: BlinkScroll-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
